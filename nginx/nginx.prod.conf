events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ============================================================
  # 注意：本配置在域名 ICP 备案完成后才启用。
  # 启用前把 xxxx.com 全部替换为真实域名，并按 docs/deployment.md
  # 「备案后切换清单」签发 Let's Encrypt 证书。
  # 备案完成前阿里云会拦截 80/443 的域名访问，本配置不生效也无害。
  # ============================================================

  # ---------- 生产环境 xxxx.com ----------

  # HTTP 强制跳转 HTTPS
  server {
    listen 80;
    server_name xxxx.com www.xxxx.com staging.xxxx.com;
    return 301 https://$host$request_uri;
  }

  # HTTPS 生产配置
  server {
    listen 443 ssl http2;
    server_name xxxx.com www.xxxx.com;

    ssl_certificate /etc/letsencrypt/live/xxxx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxxx.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # deda-dashboard 静态站点（deda-dashboard 仓库流水线直传至 /opt/deda/dashboard/prod/）
    location = /dashboard {
      return 301 /dashboard/;
    }
    location /dashboard/ {
      alias /opt/deda/dashboard/prod/;
      index index.html;
      try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      # WebSocket 支持（云对云文字通道）
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 超时设置，容纳 LLM 推理
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }

  # ---------- staging 环境 staging.xxxx.com ----------

  server {
    listen 443 ssl http2;
    server_name staging.xxxx.com;

    ssl_certificate /etc/letsencrypt/live/staging.xxxx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.xxxx.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # deda-dashboard 静态站点（staging 环境，直传至 /opt/deda/dashboard/staging/）
    location = /dashboard {
      return 301 /dashboard/;
    }
    location /dashboard/ {
      alias /opt/deda/dashboard/staging/;
      index index.html;
      try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
      # staging app 在另一 compose 项目（独立网络），经宿主回环端口访问
      proxy_pass http://host.docker.internal:3001;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
