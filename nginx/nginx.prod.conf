events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ============================================================
  # 域名 ICP 备案已完成（沪ICP备2026060466号-1，2026-11）。
  # Let's Encrypt 证书已签发并配置自动续期（ECS /opt/deda/certbot/renew.sh）。
  # ============================================================

  # ---------- 生产环境 valleyletters.com ----------

  # HTTP 强制跳转 HTTPS
  server {
    listen 80;
    server_name valleyletters.com www.valleyletters.com staging.valleyletters.com;
    return 301 https://$host$request_uri;
  }

  # HTTPS 生产配置
  server {
    listen 443 ssl http2;
    server_name valleyletters.com www.valleyletters.com;

    ssl_certificate /etc/letsencrypt/live/valleyletters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valleyletters.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # deda-dashboard 静态站点（deda-dashboard 仓库流水线直传至 /opt/deda/dashboard/prod/）
    location = /dashboard {
      return 301 /dashboard/;
    }
    location /dashboard/ {
      alias /opt/deda/dashboard/prod/;
      index index.html;
      try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
      # prod app 容器未部署时 nginx 也能启动：用 Docker 内嵌 DNS 在请求时解析，
      # 而不是启动时解析（proxy_pass 写死主机名时上游不存在会直接 emerg 起不来）。
      # app 缺席期间主域名请求返回 502，staging 子域名不受影响。
      resolver 127.0.0.11 valid=30s;
      set $app_upstream http://app:3000;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;

      # WebSocket 支持（云对云文字通道）
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 超时设置，容纳 LLM 推理
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }

  # ---------- staging 环境 staging.valleyletters.com ----------

  server {
    listen 443 ssl http2;
    server_name staging.valleyletters.com;

    ssl_certificate /etc/letsencrypt/live/staging.valleyletters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.valleyletters.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # deda-dashboard 静态站点（staging 环境，直传至 /opt/deda/dashboard/staging/）
    location = /dashboard {
      return 301 /dashboard/;
    }
    location /dashboard/ {
      alias /opt/deda/dashboard/staging/;
      index index.html;
      try_files $uri $uri/ /dashboard/index.html;
    }

    location / {
      # staging app 在另一 compose 项目（独立网络），经宿主回环端口访问
      proxy_pass http://host.docker.internal:3001;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
