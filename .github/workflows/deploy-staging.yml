name: Deploy Staging

on:
  workflow_call:
  workflow_dispatch:

# 同一环境串行部署，避免并发部署互相踩踏
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    # 正常一次部署约 5-6 分钟（PR #74 实测 5m29s：build + SSH 直传 + compose up + health check）。
    # 20 分钟留足重试余量，又能保证任一步骤僵死时及时释放 concurrency group——
    # 该 group 是 cancel-in-progress:false，一旦被占住，后续部署只能干等（2026-11-19 等了 1h21m）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t "deda-server:staging-${{ github.sha }}" .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      # 不用镜像仓库：构建产物经 SSH 直传 ECS 并加载。
      # 三层超时缺一不可（2026-11-19 本步骤僵死 1h21m，把 cancel-in-progress:false 的
      # concurrency group 占住，后续两次合并的部署全被堵死）：
      #   1) job 级 timeout-minutes —— 兜住所有步骤，含其余 ssh/scp；
      #   2) 本地 timeout 600 —— 兜住传输管道本身；
      #   3) 远端命令自带 timeout 600 —— runner 侧取消或超时后 ssh 会话消失，
      #      ECS 上的 `gunzip | docker load` 会变成永不退出的孤儿进程（实测 CPU 时间恒为 0），
      #      只有远端自己限时才不会留下僵死进程堵住下一次 docker load。
      # ServerAliveInterval=15 × ServerAliveCountMax=4 → 半开连接 60 秒内判死；ConnectTimeout 管建连。
      - name: Transfer image to ECS
        run: |
          docker save "deda-server:staging-${{ github.sha }}" | gzip | \
            timeout 600 ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15 \
              "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
              "timeout 600 sh -c 'gunzip | docker load'"

      - name: Sync compose files to ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "mkdir -p /opt/deda /opt/deda/dashboard/staging"
          scp -r docker nginx "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/deda/"

      - name: Deploy on ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<EOF
          set -e
          cd /opt/deda
          docker tag deda-server:staging-${{ github.sha }} deda-server:staging-latest
          export IMAGE_TAG="staging-${{ github.sha }}"
          docker compose -p deda-staging --env-file env/.env.staging \
            -f docker/docker-compose.yml -f docker/docker-compose.staging.yml up -d
          EOF

      - name: Health check
        run: |
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors \
            "http://${{ secrets.ECS_HOST }}:3001/api/docs" > /dev/null
