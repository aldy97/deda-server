name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# 同一环境串行部署，避免并发部署互相踩踏
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/deda-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_REGISTRY }}

      - name: Build and push image
        run: |
          docker build -f docker/Dockerfile \
            -t "$IMAGE:staging-${{ github.sha }}" \
            -t "$IMAGE:staging-latest" .
          docker push "$IMAGE:staging-${{ github.sha }}"
          docker push "$IMAGE:staging-latest"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose files to ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" "mkdir -p /opt/deda"
          scp -r docker nginx "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/deda/"

      - name: Deploy on ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<EOF
          set -e
          cd /opt/deda
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_REGISTRY }}
          export IMAGE_TAG="staging-${{ github.sha }}"
          docker compose -p deda-staging --env-file env/.env.staging \
            -f docker/docker-compose.yml -f docker/docker-compose.staging.yml pull app
          docker compose -p deda-staging --env-file env/.env.staging \
            -f docker/docker-compose.yml -f docker/docker-compose.staging.yml up -d
          EOF

      - name: Health check
        run: |
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors \
            "http://${{ secrets.ECS_HOST }}:3001/api/docs" > /dev/null
