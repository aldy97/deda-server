name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deda_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma Client 生成物（不入库），单测/e2e 的类型与运行时均依赖
      - run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Apply migrations to the isolated e2e database
        run: npx prisma migrate deploy --schema=src/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deda_test?schema=public

      - run: npm run lint

      # 仓库无 typecheck 脚本，直接调 tsc（与 pre-commit 钩子一致）
      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm run test

      # e2e 使用独立 PostgreSQL；LLM 与外部服务保持 mock，禁止 forceExit 掩盖泄漏。
      # --runInBand：所有 e2e 套件共用同一个库，而 analytics-fleet 仍有两条全局口径断言
      # （date 窗口内的全表设备计数、devices 列表按 createdAt desc 取首位），并行 worker
      # 各自新建设备行就会互相打红（925d740 收敛过一轮，这两条仍在）。共享库下串行是
      # 唯一的确定性口径；串行时各套件 afterAll 自清，互不可见。
      - run: npm run test:e2e -- --runInBand

  # 部署必须在 ci 全绿后才执行；PR 事件、以及 push 到非目标分支时，这两个 job 直接跳过。
  # deploy-staging.yml / deploy-prod.yml 自身都不带 push 触发，所以「push 就部署」
  # 只有经由下面两个 job 才走得通。
  deploy-staging:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

  # production 环境在仓库 Settings → Environments 里配了 required reviewers：
  # ci 全绿后仍需人工批准才真正部署，审批与部署日志都在该 environment 下留痕。
  deploy-prod:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
