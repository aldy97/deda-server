name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deda_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma Client 生成物（不入库），单测/e2e 的类型与运行时均依赖
      - run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Apply migrations to the isolated e2e database
        run: npx prisma migrate deploy --schema=src/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deda_test?schema=public

      - run: npm run lint

      # 仓库无 typecheck 脚本，直接调 tsc（与 pre-commit 钩子一致）
      - run: npx tsc --noEmit

      - run: npm run build

      # coverageThreshold 只在收集覆盖率时才被评估，所以走 test:cov 而非 test。
      - run: npm run test:cov

      # e2e 使用独立 PostgreSQL；LLM 与外部服务保持 mock，禁止 forceExit 掩盖泄漏。
      # --runInBand：所有 e2e 套件共用同一个库，而 analytics-fleet 仍有两条全局口径断言
      # （date 窗口内的全表设备计数、devices 列表按 createdAt desc 取首位），并行 worker
      # 各自新建设备行就会互相打红（925d740 收敛过一轮，这两条仍在）。共享库下串行是
      # 唯一的确定性口径；串行时各套件 afterAll 自清，互不可见。
      - run: npm run test:e2e -- --runInBand

  # PR 正文结构闸口（L2）：只查段落骨架齐不齐、填没填，不查措辞，不做 checkbox 正则。
  # 不设 needs，与 ci 并行；也不进分支保护 required checks——强制力来自协作铁律
  # 「CI 全绿才允许 merge」，避免单人仓库把自己锁死（L4 的经典事故）。
  # 正文经 env 传入而非内插进 run，避免注入与多行炸裂；脚本零依赖，本 job 不需要装依赖。
  # 脚本自身 fail-open：body 取不到或解析异常一律放过，只拦「明确缺段/明确空段」。
  pr-hygiene:
    name: PR 正文规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node .github/scripts/pr-hygiene.mjs

  # 部署必须在 ci 全绿后才执行；PR 事件、以及 push 到非目标分支时，这两个 job 直接跳过。
  # deploy-staging.yml / deploy-prod.yml 自身都不带 push 触发，所以「push 就部署」
  # 只有经由下面两个 job 才走得通。
  deploy-staging:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    # 这里**不能**写 timeout-minutes：GitHub 不接受 uses 型调用 job 用该键，
    # 写了会让整个 ci.yml 被判非法——run 0 秒失败、一个 job 都不起，比不加更糟
    # （2026-11-19 实测，run 44471518994）。
    # 上界由被调用的 deploy-staging.yml 内层 deploy job 自己承担（timeout-minutes: 20）；
    # 内层超时 → 可复用 workflow 结束 → 本调用 job 结束 → concurrency group 释放，保护链成立。
    # 该口径由 src/common/workflows/ci-deploy-gate.spec.ts 钉住。
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

  # production 环境在仓库 Settings → Environments 里配了 required reviewers：
  # ci 全绿后仍需人工批准才真正部署，审批与部署日志都在该 environment 下留痕。
  deploy-prod:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
    # 同上：uses 型调用 job 不能写 timeout-minutes（会让整个 ci.yml 非法）。
    # 上界由 deploy-prod.yml 内层 deploy job 承担（timeout-minutes: 25，比 staging 多 5 分钟，
    # 因为 prod 另有「部署前备份」与「健康检查失败自动回滚」两步）。
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
