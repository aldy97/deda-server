version: '3.8'

# 生产环境覆盖配置
# 用法（服务器上）：
#   docker compose --env-file env/.env.prod \
#     -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# 备案完成前：app 仅绑定回环地址，生产不对外提供服务。
# 备案完成后：nginx 监听 80/443，经 nginx.prod.conf 反代到 app。

services:
  app:
    container_name: deda-server-prod
    restart: always
    ports:
      # 仅回环：健康检查与备案后 nginx 反代走内网，公网不直接暴露
      - '127.0.0.1:3000:3000'
    volumes:
      # deda-dashboard SPA 产物兜底托管（备案后 nginx 在前，此为备用通道）。
      # 必须挂父目录而非 prod 子目录：流水线若删建子目录，bind mount 绑定的
      # 旧 inode 会让容器内永久看到空目录；挂父目录后子目录删建对容器透明。
      - /opt/deda/dashboard:/opt/deda/dashboard:ro
      # 展示型 Elly 素材（AppAsset）本地文件卷：staging/prod 共用父目录，子目录各自隔离。
      - /opt/deda/app-assets:/opt/deda/app-assets
    environment:
      DASHBOARD_DIST_PATH: /opt/deda/dashboard/prod
      # 展示型 Elly 素材
      APP_ASSET_LOCAL_DIR: /opt/deda/app-assets/prod
      APP_ASSET_PUBLIC_BASE_URL: https://valleyletters.com/app-assets/files
      APP_ASSET_HOSTS: valleyletters.com
      # 容器 limit 1536M，堆留 1024M：Node 按宿主内存（3623MiB）推算老生代上限，
      # 不限定就会在 GC 前把容器撑到 limit 被 OOM kill。余量给 Buffer/代码段/ARMS 探针。
      NODE_OPTIONS: --max-old-space-size=1024
    deploy:
      resources:
        limits:
          # ARMS 探针额外占 100-200M，随探针接入上调
          cpus: '1'
          memory: 1536M

  postgres:
    container_name: deda-postgres-prod
    ports:
      # 仅回环：服务器上排查/备份用，不对公网暴露
      - '127.0.0.1:5432:5432'
    deploy:
      resources:
        limits:
          # 与 staging 同机，必须封顶：postgres 默认 shared_buffers 按宿主内存算，
          # 连接数涨上来会一路吃到把邻居（staging app）挤进 swap 甚至 OOM。
          memory: 512M

  redis:
    container_name: deda-redis-prod
    ports:
      - '127.0.0.1:6379:6379'
    deploy:
      resources:
        limits:
          # 当前只放熔断标记、设备状态 TTL 等小键；若日后当缓存用需同步上调，
          # 否则 redis 会在触顶时被 kill（未配 maxmemory，不会自己淘汰）。
          memory: 128M

  nginx:
    container_name: deda-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    # 备案后 nginx 需要反代 staging 子域名时，经宿主回环访问 staging app(3001)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/deda/dashboard:/opt/deda/dashboard:ro

  # 设备 MQTT broker（生产）：机芯厂协议 device/up|down/{mac}，强制用户名密码认证。
  # 宿主机端口 1884：1883 被 staging broker 占用（deda-mqtt-staging），互不影响。
  # 设备接入地址：mqtt://valleyletters.com:1884（安全组需放行 1884）。
  # 配置与密码文件在服务器 /opt/deda/mosquitto-prod/ 下，不入库。
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: deda-mqtt-prod
    restart: always
    ports:
      - '1884:1883'
    volumes:
      - /opt/deda/mosquitto-prod/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/deda/mosquitto-prod/passwordfile:/mosquitto/config/passwordfile:ro
    # 必须显式加入 deda-network：缺省会落到 default 网络，app 将无法解析 mosquitto 主机名
    networks:
      - deda-network
