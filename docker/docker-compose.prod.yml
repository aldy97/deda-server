version: '3.8'

# 生产环境覆盖配置
# 用法：docker-compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  app:
    container_name: deda-server-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  nginx:
    container_name: deda-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
