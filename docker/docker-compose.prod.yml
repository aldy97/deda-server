version: '3.8'

# 生产环境覆盖配置
# 用法（服务器上）：
#   docker compose --env-file env/.env.prod \
#     -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# 备案完成前：app 仅绑定回环地址，生产不对外提供服务。
# 备案完成后：nginx 监听 80/443，经 nginx.prod.conf 反代到 app。

services:
  app:
    container_name: deda-server-prod
    restart: always
    ports:
      # 仅回环：健康检查与备案后 nginx 反代走内网，公网不直接暴露
      - '127.0.0.1:3000:3000'
    volumes:
      # deda-dashboard SPA 产物兜底托管（备案后 nginx 在前，此为备用通道）。
      # 必须挂父目录而非 prod 子目录：流水线若删建子目录，bind mount 绑定的
      # 旧 inode 会让容器内永久看到空目录；挂父目录后子目录删建对容器透明。
      - /opt/deda/dashboard:/opt/deda/dashboard:ro
    environment:
      DASHBOARD_DIST_PATH: /opt/deda/dashboard/prod
    deploy:
      resources:
        limits:
          # ARMS 探针额外占 100-200M，随探针接入上调
          cpus: '1'
          memory: 1536M

  postgres:
    container_name: deda-postgres-prod
    ports:
      # 仅回环：服务器上排查/备份用，不对公网暴露
      - '127.0.0.1:5432:5432'

  redis:
    container_name: deda-redis-prod
    ports:
      - '127.0.0.1:6379:6379'

  nginx:
    container_name: deda-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    # 备案后 nginx 需要反代 staging 子域名时，经宿主回环访问 staging app(3001)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/deda/dashboard:/opt/deda/dashboard:ro

  # 设备 MQTT broker（生产）：机芯厂协议 device/up|down/{mac}，强制用户名密码认证。
  # 宿主机端口 1884：1883 被 staging broker 占用（deda-mqtt-staging），互不影响。
  # 设备接入地址：mqtt://valleyletters.com:1884（安全组需放行 1884）。
  # 配置与密码文件在服务器 /opt/deda/mosquitto-prod/ 下，不入库。
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: deda-mqtt-prod
    restart: always
    ports:
      - '1884:1883'
    volumes:
      - /opt/deda/mosquitto-prod/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/deda/mosquitto-prod/passwordfile:/mosquitto/config/passwordfile:ro
    # 必须显式加入 deda-network：缺省会落到 default 网络，app 将无法解析 mosquitto 主机名
    networks:
      - deda-network
