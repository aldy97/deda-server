version: '3.8'

# 基础编排：基础设施 + app 服务
# 本地开发使用 docker-compose.override.yml 覆盖
# staging 使用 docker-compose.staging.yml 覆盖
# 生产环境使用 docker-compose.prod.yml 覆盖
#
# 服务器部署时通过 --env-file 注入对应环境变量文件：
#   docker compose --env-file env/.env.staging -f docker/docker-compose.yml -f docker/docker-compose.staging.yml up -d
#   docker compose --env-file env/.env.prod    -f docker/docker-compose.yml -f docker/docker-compose.prod.yml    up -d

services:
  app:
    # 部署时镜像由 CI 经 SSH 直传并在服务器上 docker load；本地可退回 build（docker compose build app）
    image: deda-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deda-server
    restart: always
    # 端口由各环境 override 文件声明（compose 对 ports 是并集合并，不能放 base）
    # 注意：这里是白名单，不是「自动继承 env 文件」。--env-file 只做 ${VAR} 替换，
    # 不会把变量注入容器；代码读了但没列在这里的键，在容器里永远是 undefined，
    # 且不会报错——env 文件里写了也白写。新增环境变量时必须同步补到这里。
    # 口径由 src/common/workflows/compose-env-gate.spec.ts 钉住。
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_NAME: ${APP_NAME:-deda-server}
      APP_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Node 按宿主机总内存推算 V8 老生代上限，不看 cgroup limit。不显式限定堆，
      # 容器会在 GC 触发前就被 OOM kill（退出码 137，日志里没有 JS 堆溢出记录）。
      # 数值由各环境 override 给定，base 只负责把变量透传进来。
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      DATABASE_URL: postgresql://deda:${DB_PASSWORD}@postgres:5432/${DB_NAME:-deda}?schema=public
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      # 微信小程序
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Analytics Dashboard 管理员鉴权
      ANALYTICS_JWT_SECRET: ${ANALYTICS_JWT_SECRET:-}
      ANALYTICS_JWT_EXPIRES_IN: ${ANALYTICS_JWT_EXPIRES_IN:-7d}
      ANALYTICS_ADMIN_USERS: ${ANALYTICS_ADMIN_USERS:-[]}
      # ARMS 应用监控（可选；不配 LicenseKey 则探针不加载，服务原样启动）
      ARMS_APP_NAME: ${ARMS_APP_NAME:-}
      ARMS_REGION_ID: ${ARMS_REGION_ID:-}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
      # 机芯厂
      MANUFACTURER_BASE_URL: ${MANUFACTURER_BASE_URL}
      MANUFACTURER_API_KEY: ${MANUFACTURER_API_KEY:-}
      MANUFACTURER_WEBHOOK_SECRET: ${MANUFACTURER_WEBHOOK_SECRET:-}
      MQTT_URL: ${MQTT_URL}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_STATUS_TOPIC: ${MQTT_STATUS_TOPIC:-zhianxin/event/report}
      MQTT_STATUS_TTL_SECONDS: ${MQTT_STATUS_TTL_SECONDS:-}
      # LLM 适配层与主模型
      LLM_ADAPTER_API_KEY: ${LLM_ADAPTER_API_KEY:-}
      LLM_ADAPTER_FILLER: ${LLM_ADAPTER_FILLER:-}
      # 机芯厂设备侧接口（client-api）：设备上线共享密钥与认领窗口
      DEVICE_LOGIN_MAC_KEY: ${DEVICE_LOGIN_MAC_KEY:-}
      PROVISION_CLAIM_WINDOW_SEC: ${PROVISION_CLAIM_WINDOW_SEC:-120}
      # 百度智能体与设备端 TTS：v1.4 getvalue 的取值来源（见 docs/voice-switching.md §2.4/§2.5）。
      # 这两个 JSON 映射刻意用空默认值：空串走的就是代码里的「未配置」分支，与不转发时
      # 逐位相同（CHARACTER_TIMBRE_JSON 空 → getvalue 一律 500，fail-closed 不给兜底音色；
      # SPEECH_RATE_MAP_JSON 空 → spd 回落基础语速 1.0）。
      BAIDU_AGENT_ENABLED: ${BAIDU_AGENT_ENABLED:-false}
      BAIDU_AGENT_TIMEOUT_MS: ${BAIDU_AGENT_TIMEOUT_MS:-5000}
      VOICE_CATALOG_JSON: ${VOICE_CATALOG_JSON:-[]}
      SPEECH_RATE_MAP_JSON: ${SPEECH_RATE_MAP_JSON:-}
      TTS_DEFAULT_VOL: ${TTS_DEFAULT_VOL:-1.0}
      CHARACTER_TIMBRE_JSON: ${CHARACTER_TIMBRE_JSON:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
      # 首响小模型（DashScope）
      SMALL_LLM_BASE_URL: ${SMALL_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SMALL_LLM_API_KEY: ${SMALL_LLM_API_KEY:-}
      SMALL_LLM_MODEL: ${SMALL_LLM_MODEL:-qwen-flash}
      LLM_STREAM_ENABLED: ${LLM_STREAM_ENABLED:-true}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      # 机芯厂回复上传
      VENDOR_WS_UPLOAD_URL: ${VENDOR_WS_UPLOAD_URL:-}
      VENDOR_UPLOAD_ACK_TIMEOUT_MS: ${VENDOR_UPLOAD_ACK_TIMEOUT_MS:-5000}
      # 流量录制
      VENDOR_TRAFFIC_RECORD: ${VENDOR_TRAFFIC_RECORD:-off}
      VENDOR_TRAFFIC_RECORD_DIR: ${VENDOR_TRAFFIC_RECORD_DIR:-records}
      VENDOR_TRAFFIC_RECORD_RETENTION_DAYS: ${VENDOR_TRAFFIC_RECORD_RETENTION_DAYS:-7}
      # 哄睡调度
      SLEEP_SCHEDULER_ENABLED: ${SLEEP_SCHEDULER_ENABLED:-false}
      # 家长报告生成（默认关，各环境 env 文件显式开启）
      PARENT_REPORT_GENERATION_ENABLED: ${PARENT_REPORT_GENERATION_ENABLED:-false}
      # 阿里云 BSS 账单（LLM 费用看板的小模型金额真值来源）
      # staging/prod 走 ECS 实例 RAM 角色：只配 ALIYUN_BSS_USE_RAM_ROLE=true，
      # 无密钥落盘、STS 自动轮转，AK/SK 两项留空即可（仅本地调试才填）。
      ALIYUN_BSS_USE_RAM_ROLE: ${ALIYUN_BSS_USE_RAM_ROLE:-false}
      ALIYUN_BSS_ACCESS_KEY_ID: ${ALIYUN_BSS_ACCESS_KEY_ID:-}
      ALIYUN_BSS_ACCESS_KEY_SECRET: ${ALIYUN_BSS_ACCESS_KEY_SECRET:-}
      # 留空则首次运行探测百炼 ProductCode 并打日志；探测确认后建议固化，省一次全量拉取
      ALIYUN_BSS_PRODUCT_CODE: ${ALIYUN_BSS_PRODUCT_CODE:-}
      ALIYUN_BSS_ENDPOINT: ${ALIYUN_BSS_ENDPOINT:-}
      # 账单增量同步（默认关）。开启后 onModuleInit 补拉一次，并每 N 分钟幂等重拉 T-1~T-lookback
      LLM_COST_SYNC_ENABLED: ${LLM_COST_SYNC_ENABLED:-false}
      LLM_COST_SYNC_INTERVAL_MINUTES: ${LLM_COST_SYNC_INTERVAL_MINUTES:-360}
      LLM_COST_SYNC_LOOKBACK_DAYS: ${LLM_COST_SYNC_LOOKBACK_DAYS:-3}
      # 微信订阅消息推送与哄睡提醒模板
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-}
      WECHAT_TMPL_SLEEP_REMINDER: ${WECHAT_TMPL_SLEEP_REMINDER:-}
      # 内容管理台写开关与发布确认码。
      # CONTENT_ADMIN_PROFILE 刻意不在此转发：只有 staging override 写死 authoring，
      # prod 不设即只读（fail-safe），转发进来会让 env 文件误配一次就能写生产内容。
      PROMPT_WRITE_ENABLED: ${PROMPT_WRITE_ENABLED:-}
      PROMPT_PUBLISH_CONFIRM_CODE: ${PROMPT_PUBLISH_CONFIRM_CODE:-}
      # 冒险内容治理阈值。以下一律留空即回落代码内默认值（adventure.constants.ts），
      # 只有需要按环境收紧时才在 env 文件里写值。
      ADVENTURE_BREAKER_WINDOW_MS: ${ADVENTURE_BREAKER_WINDOW_MS:-}
      ADVENTURE_BREAKER_THRESHOLD: ${ADVENTURE_BREAKER_THRESHOLD:-}
      ADVENTURE_BREAKER_TRIPPED_TTL_SECONDS: ${ADVENTURE_BREAKER_TRIPPED_TTL_SECONDS:-}
      ADVENTURE_RECOVERY_ENABLED: ${ADVENTURE_RECOVERY_ENABLED:-}
      ADVENTURE_RECOVERY_SWEEP_INTERVAL_MS: ${ADVENTURE_RECOVERY_SWEEP_INTERVAL_MS:-}
      ADVENTURE_RECOVERY_STALE_AWAIT_MS: ${ADVENTURE_RECOVERY_STALE_AWAIT_MS:-}
      ADVENTURE_RECOVERY_STALE_AWAIT_ACTION: ${ADVENTURE_RECOVERY_STALE_AWAIT_ACTION:-}
      ADVENTURE_LINT_MAX_TITLE_CHARS: ${ADVENTURE_LINT_MAX_TITLE_CHARS:-}
      ADVENTURE_LINT_MAX_NARRATION_CHARS: ${ADVENTURE_LINT_MAX_NARRATION_CHARS:-}
      ADVENTURE_LINT_MAX_INTERACTION_CHARS: ${ADVENTURE_LINT_MAX_INTERACTION_CHARS:-}
      ADVENTURE_LINT_MAX_STARS_PER_EPISODE: ${ADVENTURE_LINT_MAX_STARS_PER_EPISODE:-}
      ADVENTURE_LINT_MIN_CHOICE_KEY_CHARS: ${ADVENTURE_LINT_MIN_CHOICE_KEY_CHARS:-}
      ADVENTURE_LINT_MIN_CHOICE_TEXT_CHARS: ${ADVENTURE_LINT_MIN_CHOICE_TEXT_CHARS:-}
      ADVENTURE_LINT_FORBIDDEN_WORDS: ${ADVENTURE_LINT_FORBIDDEN_WORDS:-}
      ADVENTURE_SIM_MAX_AWAIT_POINTS: ${ADVENTURE_SIM_MAX_AWAIT_POINTS:-}
      ADVENTURE_SIM_MAX_SESSION_SECONDS: ${ADVENTURE_SIM_MAX_SESSION_SECONDS:-}
    depends_on:
      - postgres
      - redis
    networks:
      - deda-network

  postgres:
    image: postgres:16-alpine
    container_name: deda-postgres
    restart: always
    environment:
      POSTGRES_USER: deda
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-deda}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 端口见各 override（回环绑定）
    networks:
      - deda-network

  redis:
    image: redis:7-alpine
    container_name: deda-redis
    restart: always
    volumes:
      - redis-data:/data
    # 端口见各 override（回环绑定）
    networks:
      - deda-network

  nginx:
    image: nginx:alpine
    container_name: deda-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - deda-network

volumes:
  postgres-data:
  redis-data:

networks:
  deda-network:
    driver: bridge
